<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
    :root {
        --beige: #f5f1e8;
        --brown: #5a4634;
        --white: #ffffff;
        --black: #1a1a1a;
        --grey: #7a7a7a;
        --sage: #a8b6a3;
        --twilight-blue: #5d6d7e;
    }

    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background-color: var(--beige);
        color: var(--black);
    }

    header {
        position: relative;
        text-align: center;
        padding: 4rem 1rem 6rem;
        background: var(--sage);
        color: var(--white);
        border-bottom-left-radius: 50% 8%;
        border-bottom-right-radius: 50% 8%;
        overflow: hidden;
    }

    header img {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid var(--white);
        margin-top: 1rem;
    }

    header h1 {
        font-size: 2.5rem;
        margin: 1rem 0 0.5rem;
    }

    header p {
        max-width: 500px;
        margin: auto;
        font-size: 1.1rem;
    }

    /* Decorative doodles */
    .doodle {
        position: absolute;
        opacity: 0.15;
    }
    .doodle.star {
        top: 10%;
        left: 5%;
        font-size: 3rem;
    }
    .doodle.wave {
        bottom: 15%;
        right: 8%;
        font-size: 4rem;
    }

    main {
        max-width: 1100px;
        margin: -3rem auto 3rem;
        padding: 0 1rem;
    }

    section {
        background: var(--white);
        border-radius: 20px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        position: relative;
        overflow: hidden;
    }

    h2 {
        font-size: 1.8rem;
        color: var(--brown);
        margin-bottom: 1rem;
        position: relative;
    }

    /* Projects grid with images */
    .projects-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1.5rem;
    }

    .project-card {
        background: var(--beige);
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        transition: transform 0.2s ease;
    }

    .project-card:hover {
        transform: translateY(-5px);
    }

    .project-card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
    }

    .project-card div {
        padding: 1rem;
    }

    .project-card h3 {
        margin-top: 0;
        color: var(--twilight-blue);
    }

    /* Experience list */
    .experience-list li {
        margin-bottom: 1rem;
    }

    footer {
        text-align: center;
        padding: 1.5rem;
        background: var(--grey);
        color: var(--white);
        border-top-left-radius: 50% 8%;
        border-top-right-radius: 50% 8%;
    }
</style>
</head>
<body>

<header
